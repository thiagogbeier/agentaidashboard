receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  azure_monitor:
    connection_string: "__APPLICATION_INSIGHTS_CONNECTION_STRING__"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [azure_monitor]
    metrics:
      receivers: [otlp]
      exporters: [azure_monitor]
    logs:
      receivers: [otlp]
      exporters: [azure_monitor]
